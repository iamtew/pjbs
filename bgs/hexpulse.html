<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hex pulse — PJBS</title>
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/settings.css">
</head>
<body>
  <script type="module">
    import {
      boot, rand, wrap, glowSprite, GLOW_PASSES,
    } from '../shared/boot.js';
    import { mountSettings, hexToPixi } from '../shared/settings.js';
    const REBUILD = new Set(['sparks', 'reset']);

    const x = (v) => `${v.toFixed(2)}x`;
    const ui = mountSettings({
      title: 'Hex pulse',
      sections: [
        {
          id: 'animation',
          label: 'Animation',
          fields: [
            { key: 'speed', label: 'Speed', min: 0.1, max: 3, step: 0.05, def: 1, fmt: x },
            { key: 'hex', label: 'Hex size', min: 16, max: 72, step: 1, def: 36, int: true },
            { key: 'wave', label: 'Wave rate', min: 0.2, max: 4, step: 0.05, def: 1.35 },
            { key: 'hot', label: 'Hot threshold', min: 0.4, max: 0.95, step: 0.01, def: 0.72 },
            { key: 'colW', label: 'Col wave', min: 0.05, max: 0.8, step: 0.01, def: 0.32 },
            { key: 'rowW', label: 'Row wave', min: 0.05, max: 0.8, step: 0.01, def: 0.2 },
            { key: 'sparks', label: 'Sparks', min: 8, max: 120, step: 1, def: 48, int: true },
            { key: 'spVx', label: 'Spark drift X', min: 0, max: 80, step: 1, def: 40, int: true },
            { key: 'spVy', label: 'Spark drift Y', min: 0, max: 40, step: 1, def: 12, int: true },
            { key: 'spSzLo', label: 'Spark size min', min: 0.04, max: 0.5, step: 0.01, def: 0.12 },
            { key: 'spSzHi', label: 'Spark size max', min: 0.1, max: 0.8, step: 0.01, def: 0.35 },
          ],
        },
        {
          id: 'look',
          label: 'Look',
          fields: [
            { key: 'cA', label: 'Cyan', type: 'color', def: '#00e0e0' },
            { key: 'cB', label: 'Magenta', type: 'color', def: '#ff00ff' },
          ],
        },
      ],
    });

    boot((app, PIXI, glow) => {
      const g = new PIXI.Graphics();
      g.blendMode = 'add';
      app.stage.addChild(g);

      let sparks = [];
      let cells = [];

      function spawnSparks() {
        const s = ui.state;
        const w = app.screen.width;
        const h = app.screen.height;
        for (const spr of sparks) spr.destroy();
        sparks = Array.from({ length: s.sparks }, (_, i) => {
          const spr = glowSprite(PIXI, glow, hexToPixi(i % 2 ? s.cA : s.cB));
          spr.x = rand(0, w);
          spr.y = rand(0, h);
          spr.scale.set(rand(s.spSzLo, s.spSzHi));
          spr.vx = rand(-s.spVx * 0.5, s.spVx);
          spr.vy = rand(-s.spVy, s.spVy);
          spr.ci = i % 2;
          app.stage.addChild(spr);
          return spr;
        });
      }

      function layout() {
        const s = ui.state;
        const size = s.hex;
        const wHex = size * 1.75;
        const hHex = size * 1.52;
        const w = app.screen.width;
        const h = app.screen.height;
        cells = [];
        const cols = Math.ceil(w / wHex) + 2;
        const rows = Math.ceil(h / hHex) + 2;
        for (let row = 0; row < rows; row++) {
          for (let col = 0; col < cols; col++) {
            cells.push({
              x: col * wHex + ((row & 1) ? wHex * 0.5 : 0),
              y: row * hHex,
              col,
              row,
            });
          }
        }
      }

      spawnSparks();
      layout();
      app.renderer.on('resize', layout);
      ui.onChange = (_state, key) => {
        if (key === 'hex') layout();
        if (REBUILD.has(key) || key === 'spVx' || key === 'spVy' || key === 'spSzLo' || key === 'spSzHi') spawnSparks();
        if (key === 'reset') layout();
      };

      function hexPts(cx, cy, r) {
        const pts = [];
        for (let i = 0; i < 6; i++) {
          const a = (Math.PI / 180) * (60 * i - 30);
          pts.push(cx + r * Math.cos(a), cy + r * Math.sin(a));
        }
        return pts;
      }

      let t = 0;
      app.ticker.add((ticker) => {
        const s = ui.state;
        const dt = Math.min(ticker.deltaMS / 1000, 0.05) * s.speed;
        t += dt;
        const w = app.screen.width;
        const h = app.screen.height;
        const cyan = hexToPixi(s.cA);
        const magenta = hexToPixi(s.cB);

        g.clear();
        for (const c of cells) {
          const wave = (Math.sin(c.col * s.colW + c.row * s.rowW - t * s.wave) + 1) * 0.5;
          const hot = wave > s.hot;
          const color = c.col % 4 === 0 ? magenta : cyan;
          const pts = hexPts(c.x, c.y, s.hex * (0.82 + 0.08 * wave));
          g.poly(pts).fill({ color, alpha: 0.03 + wave * 0.16 });
          if (hot) {
            for (const [width, alpha] of GLOW_PASSES) {
              g.poly(pts).stroke({
                width: width * 0.18,
                color,
                alpha: alpha * wave * 0.85,
              });
            }
          } else {
            g.poly(pts).stroke({ width: 1.2, color, alpha: 0.12 + wave * 0.35 });
          }
        }

        for (const spr of sparks) {
          spr.tint = spr.ci ? cyan : magenta;
          spr.x += spr.vx * dt;
          spr.y += spr.vy * dt + Math.sin(t * 2 + spr.x * 0.01) * 8 * dt;
          spr.alpha = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * 3 + spr.x * 0.02));
          wrap(spr, w, h);
        }
      });
    });
  </script>
</body>
</html>
