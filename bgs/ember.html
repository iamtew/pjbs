<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ember — PJBS</title>
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/settings.css">
</head>
<body>
  <script type="module">
    import {
      boot, rand, clamp, wrap, glowSprite, hsl,
    } from '../shared/boot.js';
    import { mountSettings, hexToPixi, hexHsl } from '../shared/settings.js';

    const PAL = ['#ff3b1f', '#ff7a18', '#ffe566', '#ff6b3d'];
    const REBUILD = new Set(['dens', 'reset']);
    const x = (v) => `${v.toFixed(2)}x`;
    const ui = mountSettings({
      title: 'Ember',
      sections: [
        {
          id: 'animation',
          label: 'Animation',
          fields: [
            { key: 'speed', label: 'Speed', min: 0.1, max: 3, step: 0.05, def: 1, fmt: x },
            { key: 'dens', label: 'Density', min: 0.25, max: 2.5, step: 0.05, def: 1, fmt: x },
            { key: 'rise', label: 'Rise', min: 40, max: 420, step: 5, def: 140, int: true },
            { key: 'sway', label: 'Sway', min: 0, max: 80, step: 1, def: 28, int: true },
            { key: 'trail', label: 'Trail stretch', min: 1, max: 5, step: 0.1, def: 2.1 },
            { key: 'szLo', label: 'Size min', min: 0.06, max: 0.6, step: 0.01, def: 0.12 },
            { key: 'szHi', label: 'Size max', min: 0.12, max: 1.2, step: 0.01, def: 0.45 },
            { key: 'bokeh', label: 'Bokeh mix', min: 0, max: 0.4, step: 0.01, def: 0.14 },
          ],
        },
        {
          id: 'look',
          label: 'Look',
          fields: [
            { key: 'pal', label: 'Ember colors', type: 'palette', def: PAL },
          ],
        },
      ],
    });

    boot((app, PIXI, glow) => {
      let embers = [];

      function spawn() {
        const s = ui.state;
        const w = app.screen.width;
        const h = app.screen.height;
        const n = clamp(Math.round((w * h) / 3800 * s.dens), 40, 700);
        for (const spr of embers) spr.destroy();
        embers = [];
        for (let i = 0; i < n; i++) {
          const spr = glowSprite(PIXI, glow, hexToPixi(s.pal[i % s.pal.length]));
          spr.x = rand(0, w);
          spr.y = rand(0, h);
          spr.big = Math.random() < s.bokeh;
          spr.size = spr.big ? rand(s.szHi * 1.4, s.szHi * 2.4) : rand(s.szLo, s.szHi);
          spr.vy = rand(0.45, 1.2);
          spr.phase = rand(0, Math.PI * 2);
          spr.ci = i % s.pal.length;
          spr.alpha = spr.big ? rand(0.05, 0.12) : rand(0.35, 0.9);
          app.stage.addChild(spr);
          embers.push(spr);
        }
      }

      spawn();
      ui.onChange = (_state, key) => {
        if (REBUILD.has(key) || key === 'szLo' || key === 'szHi' || key === 'bokeh') spawn();
      };

      let t = 0;
      app.ticker.add((ticker) => {
        const s = ui.state;
        const dt = Math.min(ticker.deltaMS / 1000, 0.05) * s.speed;
        t += dt;
        const w = app.screen.width;
        const h = app.screen.height;
        const heat = hexHsl(s.pal[0]);
        app.renderer.background.color = hsl(
          heat.h + 6 * Math.sin(t * 0.25),
          Math.max(55, heat.s),
          8 + 4 * Math.sin(t * 0.4),
        );

        for (const spr of embers) {
          spr.tint = hexToPixi(s.pal[spr.ci % s.pal.length]);
          spr.y -= s.rise * spr.vy * dt;
          spr.x += Math.sin(t * 1.1 + spr.phase) * s.sway * dt;
          if (spr.y < -40) {
            spr.y = h + rand(10, 80);
            spr.x = rand(0, w);
          }
          wrap(spr, w, h, 50);
          const pulse = 0.75 + 0.25 * Math.sin(t * 6 + spr.phase);
          spr.scale.set(spr.size * pulse, spr.size * s.trail);
          if (!spr.big) spr.alpha = 0.25 + 0.6 * pulse * spr.vy;
        }
      });
    }, { background: 0x1a0804 });
  </script>
</body>
</html>
