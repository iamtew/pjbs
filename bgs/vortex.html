<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vortex — PJBS</title>
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/settings.css">
</head>
<body>
  <script type="module">
    import {
      boot, pointer, hsl, glowSprite, rand, clamp,
    } from '../shared/boot.js';
    import { mountSettings, hexToPixi, hexHsl } from '../shared/settings.js';

    const REBUILD = new Set(['sparks', 'reset']);
    const x = (v) => `${v.toFixed(2)}x`;
    const ui = mountSettings({
      title: 'Vortex',
      sections: [
        {
          id: 'animation',
          label: 'Animation',
          fields: [
            { key: 'speed', label: 'Speed', min: 0.1, max: 3, step: 0.05, def: 1, fmt: x },
            { key: 'rings', label: 'Rings', min: 6, max: 40, step: 1, def: 22, int: true },
            { key: 'sparks', label: 'Spark dens', min: 0.25, max: 2.5, step: 0.05, def: 1, fmt: x },
            { key: 'inward', label: 'Inward rate', min: 0.02, max: 0.5, step: 0.01, def: 0.18 },
            { key: 'spin', label: 'Spin', min: 0.2, max: 4, step: 0.05, def: 1, fmt: x },
            { key: 'squash', label: 'Squash', min: 0.2, max: 1, step: 0.01, def: 0.55 },
            { key: 'ringSpd', label: 'Ring crawl', min: 0.02, max: 0.4, step: 0.01, def: 0.11 },
            { key: 'hueR', label: 'Ring hue crawl', min: 0, max: 80, step: 1, def: 28, int: true },
            { key: 'hueS', label: 'Spark hue crawl', min: 0, max: 90, step: 1, def: 40, int: true },
            { key: 'szLo', label: 'Spark size min', min: 0.04, max: 0.4, step: 0.01, def: 0.08 },
            { key: 'szHi', label: 'Spark size max', min: 0.1, max: 0.7, step: 0.01, def: 0.28 },
            { key: 'core', label: 'Core size', min: 0.4, max: 2.5, step: 0.05, def: 1, fmt: x },
          ],
        },
        {
          id: 'look',
          label: 'Look',
          fields: [
            { key: 'ringC', label: 'Rings', type: 'color', def: '#ff2d6a' },
            { key: 'sparkC', label: 'Sparks', type: 'color', def: '#ff8fb3' },
            { key: 'coreC', label: 'Core', type: 'color', def: '#ffe8a0' },
          ],
        },
        {
          id: 'pointer',
          label: 'Pointer',
          fields: [
            { key: 'follow', label: 'Follow', min: 0, max: 0.25, step: 0.01, def: 0.08 },
          ],
        },
      ],
    });

    boot((app, PIXI, glow) => {
      const g = new PIXI.Graphics();
      g.blendMode = 'add';
      app.stage.addChild(g);

      let sparks = [];
      const core = glowSprite(PIXI, glow, 0xffe8a0);
      app.stage.addChild(core);

      function spawnSparks() {
        const st = ui.state;
        const w = app.screen.width;
        const h = app.screen.height;
        const n = clamp(Math.round((w * h) / 5000 * st.sparks), 30, 400);
        for (const spr of sparks) spr.destroy();
        sparks = Array.from({ length: n }, () => {
          const spr = glowSprite(PIXI, glow, 0xffffff);
          spr.ang = rand(0, Math.PI * 2);
          spr.rad = rand(0.05, 1);
          spr.spin = rand(0.4, 1.6) * (Math.random() < 0.5 ? 1 : -1);
          spr.size = rand(st.szLo, st.szHi);
          app.stage.addChild(spr);
          return spr;
        });
      }

      spawnSparks();
      ui.onChange = (_state, key) => {
        if (REBUILD.has(key) || key === 'szLo' || key === 'szHi') spawnSparks();
      };

      let t = 0;
      app.ticker.add((ticker) => {
        const s = ui.state;
        const dt = Math.min(ticker.deltaMS / 1000, 0.05) * s.speed;
        t += dt;
        const w = app.screen.width;
        const h = app.screen.height;
        const cx = w * (0.5 + (pointer.x - 0.5) * s.follow);
        const cy = h * (0.5 + (pointer.y - 0.5) * s.follow);
        const maxR = Math.hypot(w, h) * 0.72;

        const ring = hexHsl(s.ringC);
        const spark = hexHsl(s.sparkC);
        app.renderer.background.color = hsl((ring.h + t * 10) % 360, 85, 8);

        g.clear();
        for (let i = 0; i < s.rings; i++) {
          const u = ((i / s.rings) + t * s.ringSpd) % 1;
          const r = 12 + u * maxR;
          const squash = s.squash + (1 - s.squash) * u;
          const color = hsl((ring.h + t * s.hueR + u * 140) % 360, ring.s, ring.l);
          const life = Math.pow(1 - u, 1.35);
          g.ellipse(cx, cy, r, r * squash).stroke({
            width: 14 * (1 - u * 0.4),
            color,
            alpha: 0.06 * life,
          });
          g.ellipse(cx, cy, r, r * squash).stroke({
            width: 2,
            color,
            alpha: 0.55 * life,
          });
        }

        for (const spr of sparks) {
          spr.rad -= dt * s.inward;
          if (spr.rad < 0.02) spr.rad += 1;
          spr.ang += spr.spin * dt * s.spin * (1.2 + (1 - spr.rad) * 2.2);
          const r = spr.rad * maxR;
          const squash = s.squash + (1 - s.squash) * spr.rad;
          spr.x = cx + Math.cos(spr.ang) * r;
          spr.y = cy + Math.sin(spr.ang) * r * squash;
          spr.tint = hsl((spark.h + t * s.hueS + spr.ang * 40) % 360, spark.s, spark.l);
          spr.scale.set(spr.size * (0.6 + 1.8 * (1 - spr.rad)), spr.size);
          spr.rotation = spr.ang + Math.PI / 2;
          spr.alpha = 0.15 + 0.45 * (1 - spr.rad);
        }

        const pulse = 0.5 + 0.5 * Math.sin(t * 2.2);
        core.tint = hexToPixi(s.coreC);
        core.position.set(cx, cy);
        core.scale.set((1.2 + 1.8 * pulse) * s.core);
        core.alpha = 0.28 + 0.32 * pulse;
      });
    }, { background: 0x1a0010 });
  </script>
</body>
</html>
