<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caustic — PJBS</title>
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/settings.css">
</head>
<body>
  <script type="module">
    import {
      boot, rand, hsl, glowSprite,
    } from '../shared/boot.js';
    import { mountSettings, hexToPixi, hexHsl } from '../shared/settings.js';

    const PAL = ['#67e8f9', '#22d3ee', '#38bdf8', '#a5f3fc'];
    const REBUILD = new Set(['pools', 'reset']);
    const x = (v) => `${v.toFixed(2)}x`;
    const ui = mountSettings({
      title: 'Caustic',
      sections: [
        {
          id: 'animation',
          label: 'Animation',
          fields: [
            { key: 'speed', label: 'Speed', min: 0.1, max: 3, step: 0.05, def: 1, fmt: x },
            { key: 'pools', label: 'Pools', min: 8, max: 48, step: 1, def: 22, int: true },
            { key: 'wobble', label: 'Wobble', min: 0.2, max: 3, step: 0.05, def: 1, fmt: x },
            { key: 'szLo', label: 'Size min', min: 1.2, max: 8, step: 0.1, def: 3.2 },
            { key: 'szHi', label: 'Size max', min: 3, max: 16, step: 0.1, def: 8.5 },
            { key: 'alpha', label: 'Glow', min: 0.04, max: 0.35, step: 0.01, def: 0.14 },
            { key: 'hue', label: 'Hue crawl', min: 0, max: 60, step: 1, def: 12, int: true },
          ],
        },
        {
          id: 'look',
          label: 'Look',
          fields: [
            { key: 'pal', label: 'Pool colors', type: 'palette', def: PAL },
          ],
        },
      ],
    });

    boot((app, PIXI, glow) => {
      let pools = [];

      function spawn() {
        const s = ui.state;
        const w = app.screen.width;
        const h = app.screen.height;
        for (const spr of pools) spr.destroy();
        pools = Array.from({ length: s.pools }, (_, i) => {
          const spr = glowSprite(PIXI, glow, hexToPixi(s.pal[i % s.pal.length]));
          spr.ox = rand(0, w);
          spr.oy = rand(0, h);
          spr.px = rand(0.15, 0.55);
          spr.py = rand(0.12, 0.5);
          spr.ph = rand(0, Math.PI * 2);
          spr.sz = rand(s.szLo, s.szHi);
          spr.ci = i % s.pal.length;
          app.stage.addChild(spr);
          return spr;
        });
      }

      spawn();
      app.renderer.on('resize', spawn);
      ui.onChange = (_state, key) => {
        if (REBUILD.has(key) || key === 'szLo' || key === 'szHi') spawn();
      };

      let t = 0;
      app.ticker.add((ticker) => {
        const s = ui.state;
        const dt = Math.min(ticker.deltaMS / 1000, 0.05) * s.speed;
        t += dt;
        const w = app.screen.width;
        const h = app.screen.height;
        const hue = hexHsl(s.pal[0]);
        app.renderer.background.color = hsl(
          (hue.h + t * s.hue * 0.15) % 360,
          Math.max(35, hue.s * 0.55),
          8,
        );

        for (const spr of pools) {
          spr.tint = hexToPixi(s.pal[spr.ci % s.pal.length]);
          const wx = Math.sin(t * 0.55 * s.wobble + spr.ph) * w * spr.px * 0.18;
          const wy = Math.cos(t * 0.42 * s.wobble + spr.ph * 1.3) * h * spr.py * 0.16;
          spr.x = spr.ox + wx;
          spr.y = spr.oy + wy;
          const squash = 0.55 + 0.2 * Math.sin(t * 0.7 + spr.ph);
          const grow = 1 + 0.22 * Math.sin(t * 0.9 * s.wobble + spr.ph * 2);
          spr.scale.set(spr.sz * grow, spr.sz * grow * squash);
          spr.alpha = s.alpha * (0.7 + 0.3 * Math.sin(t * 1.4 + spr.ph));
          spr.rotation = Math.sin(t * 0.2 + spr.ph) * 0.4;
        }
      });
    }, { background: 0x04141c });
  </script>
</body>
</html>
