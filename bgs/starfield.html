<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starfield — PJBS</title>
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/settings.css">
</head>
<body>
  <script type="module">
    import {
      boot, pointer, rand, clamp, wrap, glowSprite,
    } from '../shared/boot.js';
    import { mountSettings, hexToPixi } from '../shared/settings.js';

    // Cosmic flow field: streaked sparks + fat bokeh.
    const PAL = ['#7ec8ff', '#c4b5fd', '#ff9ecd', '#6ee7b7', '#fde68a'];
    const REBUILD = new Set(['dens', 'bokeh', 'szLo', 'szHi', 'bkSzLo', 'bkSzHi', 'aLo', 'aHi', 'bkALo', 'bkAHi', 'spdLo', 'spdHi', 'bkSpdLo', 'bkSpdHi', 'reset']);

    const x = (v) => `${v.toFixed(2)}x`;
    const ui = mountSettings({
      title: 'Starfield',
      sections: [
        {
          id: 'animation',
          label: 'Animation',
          fields: [
            { key: 'speed', label: 'Speed', min: 0.1, max: 3, step: 0.05, def: 1, fmt: x },
            { key: 'dens', label: 'Density', min: 0.25, max: 2.5, step: 0.05, def: 1, fmt: x },
            { key: 'bokeh', label: 'Bokeh mix', min: 0, max: 0.4, step: 0.01, def: 0.1 },
            { key: 'szLo', label: 'Spark size min', min: 0.04, max: 0.6, step: 0.01, def: 0.08 },
            { key: 'szHi', label: 'Spark size max', min: 0.08, max: 1.2, step: 0.01, def: 0.32 },
            { key: 'bkSzLo', label: 'Bokeh size min', min: 0.4, max: 4, step: 0.05, def: 1.4 },
            { key: 'bkSzHi', label: 'Bokeh size max', min: 0.8, max: 6, step: 0.05, def: 2.8 },
            { key: 'aLo', label: 'Spark alpha min', min: 0.05, max: 1, step: 0.01, def: 0.4 },
            { key: 'aHi', label: 'Spark alpha max', min: 0.1, max: 1, step: 0.01, def: 0.9 },
            { key: 'bkALo', label: 'Bokeh alpha min', min: 0.02, max: 0.4, step: 0.01, def: 0.05 },
            { key: 'bkAHi', label: 'Bokeh alpha max', min: 0.04, max: 0.5, step: 0.01, def: 0.14 },
            { key: 'spdLo', label: 'Spark speed min', min: 4, max: 80, step: 1, def: 30, int: true },
            { key: 'spdHi', label: 'Spark speed max', min: 10, max: 160, step: 1, def: 95, int: true },
            { key: 'bkSpdLo', label: 'Bokeh speed min', min: 1, max: 40, step: 1, def: 8, int: true },
            { key: 'bkSpdHi', label: 'Bokeh speed max', min: 4, max: 60, step: 1, def: 22, int: true },
            { key: 'flowX', label: 'Flow X freq', min: 0.0004, max: 0.008, step: 0.0002, def: 0.0024 },
            { key: 'flowY', label: 'Flow Y freq', min: 0.0004, max: 0.008, step: 0.0002, def: 0.0028 },
            { key: 'flowT', label: 'Flow time', min: 0.02, max: 0.5, step: 0.01, def: 0.14 },
            { key: 'trail', label: 'Trail stretch', min: 1, max: 6, step: 0.1, def: 2.8 },
          ],
        },
        {
          id: 'look',
          label: 'Look',
          fields: [
            { key: 'pal', label: 'Spark colors', type: 'palette', def: PAL },
          ],
        },
        {
          id: 'pointer',
          label: 'Pointer',
          fields: [
            { key: 'rR', label: 'Repel radius', min: 0, max: 400, step: 5, def: 160, int: true },
            { key: 'rF', label: 'Repel force', min: 0, max: 900, step: 10, def: 420, int: true },
          ],
        },
      ],
    });

    boot((app, PIXI, glow) => {
      const ps = [];

      function spawn() {
        const s = ui.state;
        const w = app.screen.width;
        const h = app.screen.height;
        for (const p of ps) p.destroy();
        ps.length = 0;
        const n = clamp(Math.round((w * h) / 2800 * s.dens), 40, 900);
        for (let i = 0; i < n; i++) {
          const spr = glowSprite(PIXI, glow, hexToPixi(s.pal[i % s.pal.length]));
          spr.x = rand(0, w);
          spr.y = rand(0, h);
          const big = Math.random() < s.bokeh;
          spr.size = big ? rand(s.bkSzLo, s.bkSzHi) : rand(s.szLo, s.szHi);
          spr.alpha = big ? rand(s.bkALo, s.bkAHi) : rand(s.aLo, s.aHi);
          spr.speed = big ? rand(s.bkSpdLo, s.bkSpdHi) : rand(s.spdLo, s.spdHi);
          spr.ci = i % s.pal.length;
          app.stage.addChild(spr);
          ps.push(spr);
        }
      }

      spawn();
      ui.onChange = (_state, key) => {
        if (REBUILD.has(key)) spawn();
      };

      app.ticker.add((ticker) => {
        const s = ui.state;
        const dt = Math.min(ticker.deltaMS / 1000, 0.05) * s.speed;
        const t = performance.now() / 1000 * s.speed;
        const w = app.screen.width;
        const h = app.screen.height;
        const px = pointer.x * w;
        const py = pointer.y * h;
        const r2 = s.rR * s.rR;

        for (const p of ps) {
          p.tint = hexToPixi(s.pal[p.ci % s.pal.length]);
          const a =
            (Math.sin(p.x * s.flowX + t * s.flowT) +
              Math.cos(p.y * s.flowY - t * s.flowT * 0.64)) *
            Math.PI;
          let vx = Math.cos(a) * p.speed;
          let vy = Math.sin(a) * p.speed;
          const dx = p.x - px;
          const dy = p.y - py;
          const d2 = dx * dx + dy * dy;
          if (s.rR > 0 && d2 < r2) {
            const f = (1 - d2 / r2) * s.rF / Math.sqrt(d2 + 1);
            vx += dx * f;
            vy += dy * f;
          }
          p.x += vx * dt;
          p.y += vy * dt;
          p.rotation = Math.atan2(vy, vx);
          p.scale.set(p.size * s.trail, p.size);
          wrap(p, w, h);
        }
      });
    });
  </script>
</body>
</html>
