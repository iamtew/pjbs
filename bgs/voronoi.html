<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voronoi — PJBS</title>
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="../shared/settings.css">
</head>
<body>
  <script type="module">
    import {
      boot, pointer, rand, wrap, glowSprite, hsl, GLOW_PASSES,
    } from '../shared/boot.js';
    import { mountSettings, hexHsl } from '../shared/settings.js';

    const M = 80;
    const RINGS = [1, 0.68, 0.38];
    const REBUILD = new Set(['sites', 'fogs', 'reset']);
    const x = (v) => `${v.toFixed(2)}x`;
    const ui = mountSettings({
      title: 'Voronoi',
      sections: [
        {
          id: 'animation',
          label: 'Animation',
          fields: [
            { key: 'speed', label: 'Speed', min: 0.1, max: 3, step: 0.05, def: 1, fmt: x },
            { key: 'sites', label: 'Sites', min: 8, max: 80, step: 1, def: 48, int: true },
            { key: 'drift', label: 'Site drift', min: 4, max: 60, step: 1, def: 28, int: true },
            { key: 'flow', label: 'Flow push', min: 0, max: 60, step: 1, def: 28, int: true },
            { key: 'hue', label: 'Hue crawl', min: 0, max: 120, step: 1, def: 55, int: true },
            { key: 'cell', label: 'Cell color', type: 'color', def: '#c026d3' },
            { key: 'fill', label: 'Fill amp', min: 0, max: 2, step: 0.05, def: 1, fmt: x },
            { key: 'glow', label: 'Glow amp', min: 0.25, max: 2, step: 0.05, def: 1, fmt: x },
            { key: 'fogs', label: 'Fog count', min: 0, max: 28, step: 1, def: 12, int: true },
            { key: 'fogSzLo', label: 'Fog size min', min: 4, max: 20, step: 0.5, def: 9 },
            { key: 'fogSzHi', label: 'Fog size max', min: 8, max: 24, step: 0.5, def: 16 },
          ],
        },
        {
          id: 'pointer',
          label: 'Pointer',
          fields: [
            { key: 'rR', label: 'Repel radius', min: 0, max: 400, step: 5, def: 180, int: true },
            { key: 'rF', label: 'Repel force', min: 0, max: 800, step: 10, def: 320, int: true },
          ],
        },
      ],
    });

    function clipHalf(poly, nx, ny, c) {
      if (poly.length < 6) return poly;
      const out = [];
      const n = poly.length;
      for (let i = 0; i < n; i += 2) {
        const ax = poly[i];
        const ay = poly[i + 1];
        const bx = poly[(i + 2) % n];
        const by = poly[(i + 3) % n];
        const da = nx * ax + ny * ay - c;
        const db = nx * bx + ny * by - c;
        const den = da - db;
        const aIn = da <= 0;
        const bIn = db <= 0;
        if (aIn && bIn) {
          out.push(bx, by);
        } else if (aIn && !bIn) {
          const u = den === 0 ? 0 : da / den;
          out.push(ax + (bx - ax) * u, ay + (by - ay) * u);
        } else if (!aIn && bIn) {
          const u = den === 0 ? 0 : da / den;
          out.push(ax + (bx - ax) * u, ay + (by - ay) * u, bx, by);
        }
      }
      return out;
    }

    function inset(poly, k) {
      let cx = 0;
      let cy = 0;
      const verts = poly.length / 2;
      for (let i = 0; i < poly.length; i += 2) {
        cx += poly[i];
        cy += poly[i + 1];
      }
      cx /= verts;
      cy /= verts;
      const out = [];
      for (let i = 0; i < poly.length; i += 2) {
        out.push(cx + (poly[i] - cx) * k, cy + (poly[i + 1] - cy) * k);
      }
      return out;
    }

    function glowPoly(g, pts, color, scale, amp) {
      for (const [width, alpha] of GLOW_PASSES) {
        g.poly(pts).stroke({
          width: width * scale,
          color,
          alpha: alpha * amp,
        });
      }
    }

    boot((app, PIXI, glow) => {
      let fog = [];
      let sites = [];
      const g = new PIXI.Graphics();
      g.blendMode = 'add';
      app.stage.addChild(g);

      function spawnFog() {
        const st = ui.state;
        const w = app.screen.width;
        const h = app.screen.height;
        for (const spr of fog) spr.destroy();
        fog = Array.from({ length: st.fogs }, (_, i) => {
          const spr = glowSprite(PIXI, glow, hsl(i * 30, 95, 55));
          spr.x = rand(0, w);
          spr.y = rand(0, h);
          spr.scale.set(rand(st.fogSzLo, st.fogSzHi));
          spr.alpha = rand(0.1, 0.18);
          spr.vx = rand(-22, 22);
          spr.vy = rand(-12, 12);
          spr.phase = rand(0, Math.PI * 2);
          app.stage.addChildAt(spr, 0);
          return spr;
        });
      }

      function spawnSites() {
        const st = ui.state;
        const w = app.screen.width;
        const h = app.screen.height;
        for (const spr of sites) spr.destroy();
        sites = Array.from({ length: st.sites }, (_, i) => {
          const spr = glowSprite(PIXI, glow, hsl(i * 7.5, 95, 62));
          spr.x = rand(0, w);
          spr.y = rand(0, h);
          spr.vx = rand(-st.drift, st.drift);
          spr.vy = rand(-st.drift * 0.8, st.drift * 0.8);
          spr.phase = rand(0, Math.PI * 2);
          spr.scale.set(0.5);
          app.stage.addChild(spr);
          return spr;
        });
      }

      spawnFog();
      spawnSites();
      ui.onChange = (_state, key) => {
        if (key === 'fogs' || key === 'fogSzLo' || key === 'fogSzHi' || key === 'reset') spawnFog();
        if (key === 'sites' || key === 'drift' || key === 'reset') spawnSites();
      };

      let t = 0;
      app.ticker.add((ticker) => {
        const s = ui.state;
        const dt = Math.min(ticker.deltaMS / 1000, 0.05) * s.speed;
        t += dt;
        const w = app.screen.width;
        const h = app.screen.height;
        const px = pointer.x * w;
        const py = pointer.y * h;
        const r2 = s.rR * s.rR;
        const trip = 0.5 + 0.5 * Math.sin(t * 0.35);
        const n = sites.length;

        const cell = hexHsl(s.cell);
        app.renderer.background.color = hsl((cell.h + t * 28) % 360, cell.s * 0.8, 7 + 3 * trip);

        for (const spr of fog) {
          spr.x += spr.vx * dt;
          spr.y += spr.vy * dt;
          spr.tint = hsl((t * 40 + spr.phase * 50) % 360, 95, 58);
          spr.alpha = 0.09 + 0.12 * (0.5 + 0.5 * Math.sin(t * 1.1 + spr.phase));
          wrap(spr, w, h, 280);
        }

        for (const spr of sites) {
          let vx = spr.vx + Math.sin(spr.y * 0.004 + t * 1.3) * s.flow;
          let vy = spr.vy + Math.cos(spr.x * 0.004 - t * 1.1) * s.flow;
          const dx = spr.x - px;
          const dy = spr.y - py;
          const d2 = dx * dx + dy * dy;
          if (s.rR > 0 && d2 < r2) {
            const f = (1 - d2 / r2) * s.rF / Math.sqrt(d2 + 1);
            vx += dx * f;
            vy += dy * f;
          }
          spr.x += vx * dt;
          spr.y += vy * dt;
          wrap(spr, w, h, M);
        }

        const bounds = [-M, -M, w + M, -M, w + M, h + M, -M, h + M];
        g.clear();
        for (let i = 0; i < n; i++) {
          const si = sites[i];
          let poly = bounds;
          for (let j = 0; j < n; j++) {
            if (j === i) continue;
            const sj = sites[j];
            const nx = sj.x - si.x;
            const ny = sj.y - si.y;
            if (nx * nx + ny * ny < 1) continue;
            const c = nx * (si.x + sj.x) * 0.5 + ny * (si.y + sj.y) * 0.5;
            poly = clipHalf(poly, nx, ny, c);
            if (poly.length < 6) break;
          }
          if (poly.length < 6) continue;

          const pulse = 0.5 + 0.5 * Math.sin(t * 2.2 + si.phase);
          const wave = 0.5 + 0.5 * Math.sin(t * 1.4 + (si.x / w) * 6 + (si.y / h) * 5);
          const hue = (cell.h + t * s.hue + si.phase * 80 + i * 13) % 360;
          const breath = 1 + 0.08 * Math.sin(t * 3.1 + si.phase);
          const amp = (0.45 + pulse * 0.55 + wave * 0.25) * s.glow;

          g.poly(poly).fill({
            color: hsl((hue + 180) % 360, 95, 52),
            alpha: (0.05 + pulse * 0.1 + trip * 0.04) * s.fill,
          });

          for (let r = 0; r < RINGS.length; r++) {
            const k = RINGS[r] * breath;
            const ring = r === 0 ? poly : inset(poly, k);
            const color = hsl((hue + r * 137) % 360, 100, 58 + r * 6);
            glowPoly(g, ring, color, (0.28 - r * 0.06) * (0.85 + wave * 0.4), amp);
          }

          si.tint = hsl((hue + 40) % 360, 100, 68);
          si.alpha = 0.45 + 0.55 * pulse;
          si.scale.set(0.35 + 0.55 * pulse + 0.2 * trip);
        }
      });
    }, { background: 0x1a0022 });
  </script>
</body>
</html>
